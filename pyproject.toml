[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascend-npu-top"
dynamic = ["version"]
description = "A read-only terminal dashboard for Huawei Ascend NPUs"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["rich>=13.7"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.scripts]
npu-top = "npu_top:cli"

[project.urls]
Repository = "https://github.com/demouo/npu-top"
Issues = "https://github.com/demouo/npu-top/issues"

[tool.setuptools]
py-modules = ["npu_top"]

[tool.setuptools.dynamic]
version = {attr = "npu_top.__version__"}
